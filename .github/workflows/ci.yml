name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check release package versions
        run: npm run check:release-package-versions

      - name: Release policy tests
        run: npm run test:release-policy

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check import boundary
        run: npm run check:import-boundary

      - name: Tarball smoke test
        run: npm run test:tarball

      - name: Pack dry run
        run: npm pack --dry-run
